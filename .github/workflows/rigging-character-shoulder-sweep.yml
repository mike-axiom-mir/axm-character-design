name: Rigging connected shoulder dense deformation sweep

on:
  push:
    branches:
      - studio/rigging-character-shoulder-sweep-001
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Character head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Full Character unit suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build exact Rigging sweep evidence
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: src
        run: python tools/build_connected_shoulder_deformation_sweep_evidence.py --out evidence/character-connected-shoulder-deformation-sweep-001
      - name: Bind retained evidence to exact lineage
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf '%s\n' "$actual" > evidence/character-connected-shoulder-deformation-sweep-001/exact-head.txt
          printf '%s\n' "eae6d296867ecaa40e8f5c3f1fe37d8e3019541e" > evidence/character-connected-shoulder-deformation-sweep-001/exact-self-intersection-head.txt
          printf '%s\n' "b0a03cbcb61e0f8deec37172d22ff1a7fff306c9" > evidence/character-connected-shoulder-deformation-sweep-001/exact-rigging-head.txt
          printf '%s\n' "dcb2185a42072540ef2be37329735357561e01b5" > evidence/character-connected-shoulder-deformation-sweep-001/exact-geometry-head.txt
      - name: Upload exact retained Rigging sweep evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: character-connected-shoulder-deformation-sweep-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/character-connected-shoulder-deformation-sweep-001/
          if-no-files-found: error
