name: Rigging shoulder opening-repair rebind evidence

on:
  push:
    branches:
      - studio/rigging-character-shoulder-opening-rebind-001
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Character head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Full Character unit suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build exact Rigging rebind evidence
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: src
        run: python tools/build_connected_shoulder_opening_repair_rigging_rebind_evidence.py --out evidence/character-shoulder-opening-repair-rigging-rebind-001
      - name: Bind retained evidence to exact lineage
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          geometry="8cc4a180cd1481d680841190b0038b4b330133ae"
          profile_source="62a60ee6b930d13898203d37b0cc9dab6b13d99d"
          donor_rig="b0a03cbcb61e0f8deec37172d22ff1a7fff306c9"
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$geometry" HEAD
          git fetch --no-tags origin "$profile_source" "$donor_rig"
          git cat-file -e "$profile_source^{commit}"
          git cat-file -e "$donor_rig^{commit}"
          printf '%s\n' "$actual" > evidence/character-shoulder-opening-repair-rigging-rebind-001/exact-head.txt
          printf '%s\n' "$geometry" > evidence/character-shoulder-opening-repair-rigging-rebind-001/exact-geometry-repair-head.txt
          printf '%s\n' "$profile_source" > evidence/character-shoulder-opening-repair-rigging-rebind-001/exact-rigging-profile-source-head.txt
          printf '%s\n' "$donor_rig" > evidence/character-shoulder-opening-repair-rigging-rebind-001/exact-donor-rigging-head.txt
      - name: Upload exact retained Rigging rebind evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: character-shoulder-opening-repair-rigging-rebind-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/character-shoulder-opening-repair-rigging-rebind-001/
          if-no-files-found: error
