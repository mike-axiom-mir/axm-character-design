name: Geometry Character shoulder diagonal repair evidence

on:
  push:
    branches:
      - studio/geometry-character-shoulder-diagonal-repair-002
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Character head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Full Character unit suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build exact bounded diagonal-search evidence
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: src
        run: python tools/build_connected_shoulder_diagonal_repair_evidence.py --out evidence/character-connected-shoulder-diagonal-repair-002
      - name: Bind retained evidence to exact lineage
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf '%s\n' "$actual" > evidence/character-connected-shoulder-diagonal-repair-002/exact-head.txt
          printf '%s\n' "8cc4a180cd1481d680841190b0038b4b330133ae" > evidence/character-connected-shoulder-diagonal-repair-002/exact-opening-repair-head.txt
          printf '%s\n' "ef73f87e0ebe4ce101b2fe25a92441ada7837b83" > evidence/character-connected-shoulder-diagonal-repair-002/latest-known-rigging-rebind-head.txt
      - name: Upload exact retained Geometry evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: character-connected-shoulder-diagonal-repair-002-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/character-connected-shoulder-diagonal-repair-002/
          if-no-files-found: error
