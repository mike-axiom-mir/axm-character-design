name: Geometry Character shoulder stitch-edge repair evidence

on:
  push:
    branches:
      - studio/geometry-character-shoulder-stitch-edge-repair-001
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Character head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m compileall -q src tools tests

      - name: Full Character unit suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build exact Geometry stitch-edge evidence
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: src
        run: >-
          python tools/build_connected_shoulder_stitch_edge_repair_evidence.py
          --out evidence/character-shoulder-stitch-edge-repair-001

      - name: Bind retained evidence to exact lineage
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          geometry="fa69eea233a56dc7e09b22c62a9e37bfa97bc994"
          rigging="e5b129ba936f252946f48921be5a3096d8c2f801"
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$geometry" HEAD
          git merge-base --is-ancestor "$rigging" HEAD
          git cat-file -e "$geometry^{commit}"
          git cat-file -e "$rigging^{commit}"
          printf '%s\n' "$actual" > evidence/character-shoulder-stitch-edge-repair-001/exact-head.txt
          printf '%s\n' "$geometry" > evidence/character-shoulder-stitch-edge-repair-001/exact-geometry-diagonal-repair-head.txt
          printf '%s\n' "$rigging" > evidence/character-shoulder-stitch-edge-repair-001/exact-rigging-diagonal-rebind-head.txt

      - name: Upload exact retained Geometry stitch-edge evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: character-shoulder-stitch-edge-repair-001-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/character-shoulder-stitch-edge-repair-001/
          if-no-files-found: error
