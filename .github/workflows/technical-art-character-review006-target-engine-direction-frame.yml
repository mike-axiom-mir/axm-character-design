name: Technical Art Character review006 target-engine direction-frame hypothesis evidence

on:
  push:
    branches: [studio/technical-art-character-review006-uc-skin-transport-001]
    paths:
      - "tools/build_review006_target_engine_direction_frame_hypothesis_evidence.py"
      - "lookdev-proof/character_review006_target_engine_direction_frame_hypothesis_observe.gd"
      - "lookdev-proof/project.godot"
      - ".github/workflows/technical-art-character-review006-target-engine-direction-frame.yml"
  pull_request:
    paths:
      - "tools/build_review006_target_engine_direction_frame_hypothesis_evidence.py"
      - "lookdev-proof/character_review006_target_engine_direction_frame_hypothesis_observe.gd"
      - "lookdev-proof/project.godot"
      - ".github/workflows/technical-art-character-review006-target-engine-direction-frame.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-engine-direction-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact Technical Art head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bind exact Technical Art, Rigging, Materials and UC identities
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a61f96d2cf8c33b153d17810ad18ca48074b81d2 HEAD
          git fetch --no-tags origin 4efa5772ee63f62d7a7e5b4ef6688550034b4659
          git fetch --no-tags origin 9978794604d31aff1f326a6a0dedd2d81dccf31f
          test "$(git rev-parse 4efa5772ee63f62d7a7e5b4ef6688550034b4659:src/axm_character_design/review006_shoulder_deformation_gradient_frame.py)" = "57c43aea818f293274a94457252bf87e20b98897"
          test "$(git rev-parse 9978794604d31aff1f326a6a0dedd2d81dccf31f:lookdev-proof/character_review006_current_motion_host_equivalent_direction_frame_observe.gd)" = "349b6b7374d1704907a00f90c9e8c5e6940cdb65"
          test "$(git ls-remote https://github.com/mike-axiom-mir/axm-universal-creation.git refs/heads/main | cut -f1)" = "41b4d9134e4d2e5f4fadaada2a1d6a56eed92ab0"
          mkdir -p lookdev-proof/generated
          git rev-parse HEAD > lookdev-proof/generated/exact-technical-art-head.txt
          printf '%s\n' 4efa5772ee63f62d7a7e5b4ef6688550034b4659 > lookdev-proof/generated/exact-rigging-head.txt
          printf '%s\n' 9978794604d31aff1f326a6a0dedd2d81dccf31f > lookdev-proof/generated/exact-materials-head.txt
          printf '%s\n' 41b4d9134e4d2e5f4fadaada2a1d6a56eed92ab0 > lookdev-proof/generated/exact-uc-head.txt

      - name: Compile and run complete Character suite
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests tools
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build exact Rigging deformation-gradient oracle from owner head
        run: |
          set -euo pipefail
          rm -rf /tmp/axm-rigging-owner
          git worktree add --detach /tmp/axm-rigging-owner 4efa5772ee63f62d7a7e5b4ef6688550034b4659
          PYTHONPATH=/tmp/axm-rigging-owner/src python - <<'PY'
          import json
          from pathlib import Path
          from axm_character_design.review006_shoulder_deformation_gradient_frame import (
              audit_review006_deformation_gradient_frame,
          )
          result = audit_review006_deformation_gradient_frame()
          assert result["status"] == "PASS_CHARACTER_REVIEW006_RIG_DEFORMATION_GRADIENT_FRAME_REFERENCE__STRUCTURAL_BOUNDARY_UNCHANGED", result
          out = Path("lookdev-proof/generated/exact-rigging-deformation-gradient-frame.json")
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "status": result["status"],
              "row_count": result["deformation_gradient_reference"]["row_count"],
              "max_owner_affine_position_residual_m": result["deformation_gradient_reference"]["max_owner_affine_position_residual_m"],
          }, indent=2, sort_keys=True))
          PY
          git worktree remove --force /tmp/axm-rigging-owner

      - name: Build exact target-engine direction-frame hypothesis payload
        env:
          PYTHONPATH: src
        run: python tools/build_review006_target_engine_direction_frame_hypothesis_evidence.py

      - name: Prove malformed Rigging oracle fails closed
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, tempfile
          from pathlib import Path
          source = Path("lookdev-proof/generated/exact-rigging-deformation-gradient-frame.json")
          data = json.loads(source.read_text())
          data["deformation_gradient_reference"]["rows"] = [
              row for row in data["deformation_gradient_reference"]["rows"]
              if not (row["side"] == "L" and float(row["angle_deg"]) == -30.0 and row["group"] == "proximal")
          ]
          temp = Path(tempfile.mkdtemp())
          bad = temp / "bad-rigging-oracle.json"
          bad.write_text(json.dumps(data))
          proc = subprocess.run(
              [sys.executable, "tools/build_review006_target_engine_direction_frame_hypothesis_evidence.py",
               "--rigging-oracle", str(bad), "--out-dir", str(temp / "out")],
              env={**os.environ, "PYTHONPATH": "src"}, capture_output=True, text=True
          )
          assert proc.returncode != 0, (proc.stdout, proc.stderr)
          assert "missing Rigging oracle row" in (proc.stdout + proc.stderr), (proc.stdout, proc.stderr)
          print("missing exact Rigging row rejected as expected")
          PY

      - name: Download pinned Godot 4.7.2
        if: matrix.python-version == '3.11'
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        if: matrix.python-version == '3.11'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Render real target normal buffer against owner hypotheses
        if: matrix.python-version == '3.11'
        run: |
          set -euo pipefail
          rm -f lookdev-proof/character-review006-target-engine-direction-frame-*.png
          rm -f lookdev-proof/character-review006-target-engine-direction-frame-hypothesis-runtime-receipt.json
          xvfb-run --auto-servernum --server-args="-screen 0 1100x850x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path lookdev-proof \
            --script character_review006_target_engine_direction_frame_hypothesis_observe.gd

      - name: Validate bounded target-engine direction-frame diagnosis
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("lookdev-proof")
          receipt = json.loads((root / "character-review006-target-engine-direction-frame-hypothesis-runtime-receipt.json").read_text())
          assert receipt["state"] == "PASS_DIAGNOSTIC", receipt
          allowed = {
              "PASS_CHARACTER_REVIEW006_GODOT_TARGET_NORMAL_BUFFER_CONSISTENTLY_NEARER_RIGGING_LINEAR_GRADIENT_REFERENCE__INVERSE_TRANSPOSE_SEPARATION_SUB_LSB",
              "PASS_CHARACTER_REVIEW006_GODOT_TARGET_NORMAL_BUFFER_CONSISTENT_WITH_RIGGING_INVERSE_TRANSPOSE_HYPOTHESIS",
              "PASS_CHARACTER_REVIEW006_GODOT_TARGET_NORMAL_BUFFER_CONSISTENT_WITH_POSE_RECOMPUTED_HYPOTHESIS",
              "FAIL_CHARACTER_REVIEW006_GODOT_TARGET_NORMAL_BUFFER_CONSISTENT_WITH_FROZEN_NEUTRAL_CONTROL",
              "HOLD_CHARACTER_REVIEW006_GODOT_TARGET_NORMAL_BUFFER_MIXED_OR_UNRESOLVED_HYPOTHESES",
              "INCONCLUSIVE_CHARACTER_REVIEW006_TARGET_ENGINE_DIRECTION_FRAME__POSITION_CONTROL_MISMATCH",
              "HOLD_CHARACTER_REVIEW006_TARGET_ENGINE_DIRECTION_FRAME__NEUTRAL_NORMAL_BUFFER_GATE_NOT_CLOSED",
              "HOLD_CHARACTER_REVIEW006_TARGET_ENGINE_DIRECTION_FRAME__OBSERVER_SENSITIVITY_NOT_PROVEN",
          }
          assert receipt["result"] in allowed, receipt
          assert receipt["deformed_comparison_count"] == 6, receipt
          if receipt["result"] == "PASS_CHARACTER_REVIEW006_GODOT_TARGET_NORMAL_BUFFER_CONSISTENTLY_NEARER_RIGGING_LINEAR_GRADIENT_REFERENCE__INVERSE_TRANSPOSE_SEPARATION_SUB_LSB":
              assert receipt["linear_beats_inverse_count"] == 6, receipt
              assert receipt["minimum_linear_to_nonrig_separation_ratio"] >= 100.0, receipt
              assert receipt["maximum_linear_mean_abs_rgb_channel_delta"] <= 0.002, receipt
          assert receipt["truth_boundary"]["uc_product_modified"] is False, receipt
          assert receipt["truth_boundary"]["godot_skinning_implementation_claim"] is False, receipt
          assert receipt["truth_boundary"]["production_normals_or_tangents"] is False, receipt
          for sample in ("80", "240"):
              for context, row in receipt["comparisons"][sample].items():
                  assert row["normal_buffer_diffs"]["linear_gradient"]["masked_pixels"] > 1000, (sample, context, row)
                  assert row["normal_buffer_diffs"]["inverse_transpose"]["masked_pixels"] > 1000, (sample, context, row)
                  assert row["inverted_linear_negative"]["changed_pixels_gt_1lsb"] > 0, (sample, context, row)
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Retain exact target-engine direction-frame evidence
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: character-review006-target-engine-direction-frame-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tools/build_review006_target_engine_direction_frame_hypothesis_evidence.py
            lookdev-proof/project.godot
            lookdev-proof/character_review006_target_engine_direction_frame_hypothesis_observe.gd
            lookdev-proof/generated/exact-technical-art-head.txt
            lookdev-proof/generated/exact-rigging-head.txt
            lookdev-proof/generated/exact-materials-head.txt
            lookdev-proof/generated/exact-uc-head.txt
            lookdev-proof/generated/exact-rigging-deformation-gradient-frame.json
            lookdev-proof/generated/character_review006_target_engine_direction_frame_hypothesis_payload.json
            lookdev-proof/generated/character-review006-target-engine-direction-frame-target.glb
            lookdev-proof/character-review006-target-engine-direction-frame-hypothesis-runtime-receipt.json
            lookdev-proof/character-review006-target-engine-direction-frame-*.png
          if-no-files-found: warn
          retention-days: 60
