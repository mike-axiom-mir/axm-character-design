name: Animation Character review006 target-host playback

on:
  push:
    branches: [studio/animation-character-review006-target-host-playback-002]
    paths:
      - "animation/character_review006_target_host_playback_review_001.json"
      - "animation-proof/project.godot"
      - "animation-proof/character_review006_target_host_playback_observe.gd"
      - ".github/workflows/animation-character-review006-target-host-playback.yml"
  pull_request:
    paths:
      - "animation/character_review006_target_host_playback_review_001.json"
      - "animation-proof/project.godot"
      - "animation-proof/character_review006_target_host_playback_observe.gd"
      - ".github/workflows/animation-character-review006-target-host-playback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-host-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact Animation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind exact current Character lineage
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c2ae66c75abac064b679f1597b7544d058dc3ad1 HEAD
          git merge-base --is-ancestor 1c021d40d7d606f6fb2a29e69f9353640aa33f60 HEAD
          git merge-base --is-ancestor 9519be55581c009fd800d175677d9b50ee6926e6 HEAD
          git merge-base --is-ancestor fa16c44b1a488d43842470fc9f30c5fb5e98cab6 HEAD
          test "$(git rev-parse c2ae66c75abac064b679f1597b7544d058dc3ad1:tools/build_character_review006_current_motion_direction_frame_evidence.py)" = "a6b928c284f04e86e022276ec82768b86341f262"
          test "$(git rev-parse 1c021d40d7d606f6fb2a29e69f9353640aa33f60:src/axm_character_design/review006_uc_skin_transport.py)" = "831fd7522ec2a8783862da653d6f12465252a3b2"
          mkdir -p animation-proof/generated
          git rev-parse HEAD > animation-proof/generated/exact-animation-playback-head.txt
          printf '%s\n' c2ae66c75abac064b679f1597b7544d058dc3ad1 > animation-proof/generated/exact-materials-parent-head.txt
          printf '%s\n' 1c021d40d7d606f6fb2a29e69f9353640aa33f60 > animation-proof/generated/exact-technical-art-head.txt
          printf '%s\n' 9519be55581c009fd800d175677d9b50ee6926e6 > animation-proof/generated/exact-source-animation-head.txt
          printf '%s\n' fa16c44b1a488d43842470fc9f30c5fb5e98cab6 > animation-proof/generated/exact-rigging-head.txt

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile and run complete Character suite
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src tests tools
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate exact Animation playback contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('animation/character_review006_target_host_playback_review_001.json')
          d=json.loads(p.read_text())
          assert d['schema']=='axm.character-review006-target-host-playback/v0.1',d
          assert d['materials_parent_head']=='c2ae66c75abac064b679f1597b7544d058dc3ad1',d
          assert d['technical_art_head']=='1c021d40d7d606f6fb2a29e69f9353640aa33f60',d
          assert d['source_animation_head']=='9519be55581c009fd800d175677d9b50ee6926e6',d
          assert d['rigging_head']=='fa16c44b1a488d43842470fc9f30c5fb5e98cab6',d
          assert d['target_glb_sha256']=='76acbfca2c50151f4c801bf34910f94eea6bd6d165caeb1e344b8001a2b83a99',d
          assert d['source_motion']['motion_reauthored'] is False,d
          assert d['truth_boundary']['runtime_controller_or_state_machine']=='NOT_EVALUATED',d
          assert d['truth_boundary']['physics_collision_input_gameplay']=='NOT_EVALUATED',d
          assert d['known_downstream_boundary']['materials_current_motion_result']=='INCONCLUSIVE_CHARACTER_REVIEW006_TARGET_DIRECTION_FRAME_MIXED_RESPONSE',d
          print('exact Animation target-host contract identity PASS')
          PY

      - name: Build exact current transport GLB and payload
        if: matrix.python-version == '3.11'
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          rm -rf lookdev-proof/generated
          mkdir -p lookdev-proof/generated animation-proof/generated
          python tools/build_character_review006_current_motion_direction_frame_evidence.py
          test "$(sha256sum lookdev-proof/generated/character-review006-current-motion-target.glb | awk '{print $1}')" = "76acbfca2c50151f4c801bf34910f94eea6bd6d165caeb1e344b8001a2b83a99"
          cp lookdev-proof/generated/character-review006-current-motion-target.glb animation-proof/generated/
          cp lookdev-proof/generated/character_review006_current_motion_direction_frame_payload.json animation-proof/generated/
          cp animation/character_review006_target_host_playback_review_001.json animation-proof/character_review006_target_host_playback_review_001.json

      - name: Download pinned Godot 4.7.2
        if: matrix.python-version == '3.11'
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Install virtual display when needed
        if: matrix.python-version == '3.11'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Exercise exact imported clip through AnimationPlayer
        if: matrix.python-version == '3.11'
        run: |
          set -euo pipefail
          rm -f animation-proof/character-review006-target-host-playback-runtime-receipt.json
          xvfb-run --auto-servernum --server-args="-screen 0 800x600x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path animation-proof \
            --script character_review006_target_host_playback_observe.gd

      - name: Validate bounded target-host playback evidence
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('animation-proof/character-review006-target-host-playback-runtime-receipt.json')
          r=json.loads(p.read_text())
          assert r['state']=='PASS_DIAGNOSTIC',r
          assert r['result']=='PASS_CHARACTER_REVIEW006_TARGET_HOST_ANIMATIONPLAYER_INTERPOLATION_AND_PLAYBACK_TRACE',r
          assert r['identity']['target_glb_sha256']=='76acbfca2c50151f4c801bf34910f94eea6bd6d165caeb1e344b8001a2b83a99',r
          assert r['midpoint_interpolation']['intervals_checked']==320,r
          assert r['negative_control']['expected_rejection'] is True,r
          assert r['wall_clock_playback']['capture_free'] is True,r
          assert r['wall_clock_playback']['position_monotonic_violations']==0,r
          assert r['preserved_downstream_boundary']['materials_result']=='INCONCLUSIVE_CHARACTER_REVIEW006_TARGET_DIRECTION_FRAME_MIXED_RESPONSE',r
          assert r['truth_boundary']['runtime_controller_or_state_machine']=='NOT_EVALUATED',r
          assert r['truth_boundary']['physics_collision_input_gameplay']=='NOT_EVALUATED',r
          print(json.dumps(r,indent=2))
          PY

      - name: Retain exact Character target-host playback evidence
        if: matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: character-review006-target-host-playback-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            animation/character_review006_target_host_playback_review_001.json
            animation-proof/project.godot
            animation-proof/character_review006_target_host_playback_observe.gd
            animation-proof/generated/character_review006_current_motion_direction_frame_payload.json
            animation-proof/generated/character-review006-current-motion-target.glb
            animation-proof/generated/exact-animation-playback-head.txt
            animation-proof/generated/exact-materials-parent-head.txt
            animation-proof/generated/exact-technical-art-head.txt
            animation-proof/generated/exact-source-animation-head.txt
            animation-proof/generated/exact-rigging-head.txt
            animation-proof/character-review006-target-host-playback-runtime-receipt.json
          if-no-files-found: warn
          retention-days: 60
